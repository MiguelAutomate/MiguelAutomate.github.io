<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boxing Training Timer - Miguel Ocampo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .font-clock {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Smooth transitions for views */
        .view-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .view-section.active {
            display: flex;
            opacity: 1;
        }

        /* Clock pulse animation */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .timer-paused {
            animation: pulse-soft 2s infinite;
        }
    </style>
</head>
<body class="h-screen w-full overflow-hidden flex flex-col">

    <!-- Header (Hidden in active timer) -->
    <header id="main-header" class="p-4 flex items-center justify-between bg-slate-900 border-b border-slate-800 z-10 shadow-md">
        <button id="btn-back" class="hidden text-slate-400 hover:text-white p-2 -ml-2 transition">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        <h1 id="header-title" class="text-xl font-bold tracking-wider text-white uppercase text-center flex-1">Boxing - Miguel Ocampo</h1>
        <div class="w-8"></div> <!-- Spacer for flex balance -->
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-hidden">
        
        <!-- HOME VIEW -->
        <section id="view-home" class="view-section active flex-col h-full p-6 space-y-6 justify-center">
            <button onclick="navTo('rounds-setup')" class="group relative w-full bg-gradient-to-br from-red-600 to-red-800 rounded-2xl p-8 flex flex-col items-center justify-center shadow-lg shadow-red-900/20 active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-white/90 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <h2 class="text-3xl font-bold mb-2">Rounds</h2>
                <p class="text-red-100 text-center font-medium">Sparring & Fight</p>
            </button>

            <button onclick="navTo('timer-setup')" class="group relative w-full bg-gradient-to-br from-slate-700 to-slate-800 rounded-2xl p-8 flex flex-col items-center justify-center shadow-lg active:scale-95 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-white/90 group-hover:scale-110 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h2 class="text-3xl font-bold mb-2">Timer</h2>
                <p class="text-slate-300 text-center font-medium">General Training</p>
            </button>
        </section>

        <!-- ROUNDS SETUP VIEW -->
        <section id="view-rounds-setup" class="view-section flex-col h-full p-4 justify-center items-center overflow-y-auto pb-6">
            <div class="space-y-4 w-full max-w-sm mt-auto">
                
                <!-- Number of Rounds Stepper -->
                <div class="bg-slate-800 rounded-2xl p-4 shadow-inner">
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 text-center">Number of Rounds</p>
                    <div class="flex items-center justify-between bg-slate-900 rounded-xl p-2">
                        <button onclick="adjustSetting('rounds', -1)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" /></svg></button>
                        <span id="setup-val-rounds" class="text-3xl font-clock font-bold w-20 text-center">5</span>
                        <button onclick="adjustSetting('rounds', 1)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></button>
                    </div>
                </div>

                <!-- Round Length Stepper -->
                <div class="bg-slate-800 rounded-2xl p-4 shadow-inner">
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 text-center">Round Length</p>
                    <div class="flex items-center justify-between bg-slate-900 rounded-xl p-2">
                        <button onclick="adjustSetting('roundTime', -30)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" /></svg></button>
                        <span id="setup-val-roundTime" class="text-3xl font-clock font-bold w-24 text-center">03:00</span>
                        <button onclick="adjustSetting('roundTime', 30)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></button>
                    </div>
                </div>

                <!-- Break Length Stepper -->
                <div class="bg-slate-800 rounded-2xl p-4 shadow-inner">
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 text-center">Break Length</p>
                    <div class="flex items-center justify-between bg-slate-900 rounded-xl p-2">
                        <button onclick="adjustSetting('breakTime', -15)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" /></svg></button>
                        <span id="setup-val-breakTime" class="text-3xl font-clock font-bold w-24 text-center">01:00</span>
                        <button onclick="adjustSetting('breakTime', 15)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></button>
                    </div>
                </div>

                <!-- Warning Stepper -->
                <div class="bg-slate-800 rounded-2xl p-4 shadow-inner">
                    <p class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 text-center">Round Warning</p>
                    <div class="flex items-center justify-between bg-slate-900 rounded-xl p-2">
                        <button onclick="adjustSetting('warningTime', -10)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" /></svg></button>
                        <span id="setup-val-warningTime" class="text-3xl font-clock font-bold w-24 text-center">10s</span>
                        <button onclick="adjustSetting('warningTime', 10)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-lg flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></button>
                    </div>
                </div>
            </div>

            <button onclick="startRounds()" class="w-full max-w-sm mx-auto bg-red-600 hover:bg-red-500 text-white py-4 rounded-2xl text-xl font-bold uppercase tracking-widest shadow-[0_0_20px_rgba(220,38,38,0.4)] active:scale-95 transition-all mt-6 mb-auto">
                Start Workout
            </button>
        </section>

        <!-- TIMER SETUP VIEW -->
        <section id="view-timer-setup" class="view-section flex-col h-full p-6 justify-center items-center pb-10 space-y-8">
            <div class="text-center w-full max-w-sm">
                <h2 class="text-2xl font-bold text-slate-300 mb-2">Set Training Timer</h2>
                <p class="text-slate-500">Continuous countdown</p>
            </div>

            <div class="bg-slate-800 rounded-2xl p-6 shadow-inner mx-auto w-full max-w-sm">
                <div class="flex items-center justify-between bg-slate-900 rounded-xl p-3">
                    <button onclick="adjustSetting('trainingTime', -30)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-xl flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" /></svg></button>
                    <span id="setup-val-trainingTime" class="text-4xl sm:text-5xl font-clock font-bold w-28 sm:w-32 text-center">05:00</span>
                    <button onclick="adjustSetting('trainingTime', 30)" class="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-xl flex items-center justify-center active:bg-slate-500 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg></button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 max-w-sm mx-auto w-full">
                <button onclick="setTrainingTime(60)" class="bg-slate-800 py-3 rounded-lg font-bold text-slate-300 active:bg-slate-700 transition">1:00</button>
                <button onclick="setTrainingTime(180)" class="bg-slate-800 py-3 rounded-lg font-bold text-slate-300 active:bg-slate-700 transition">3:00</button>
                <button onclick="setTrainingTime(300)" class="bg-slate-800 py-3 rounded-lg font-bold text-slate-300 active:bg-slate-700 transition">5:00</button>
            </div>

            <button onclick="startTrainingTimer()" class="w-full max-w-sm mx-auto bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl text-xl font-bold uppercase tracking-widest shadow-[0_0_20px_rgba(37,99,235,0.4)] active:scale-95 transition-all mt-8">
                Start Timer
            </button>
        </section>

        <!-- ACTIVE TIMER VIEW (Used for both Rounds and Training) -->
        <section id="view-active-timer" class="view-section flex-col h-full items-center justify-center p-6 bg-slate-900 transition-colors duration-500">
            
            <div id="active-state-badge" class="mb-8 px-6 py-2 rounded-full text-xl font-bold uppercase tracking-widest bg-slate-800 text-slate-300 shadow-md">
                Get Ready
            </div>

            <div class="relative w-full aspect-square max-w-[350px] mx-auto flex items-center justify-center rounded-full border-8 border-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.5)] mb-12">
                <div id="active-time-display" class="text-[5.5rem] leading-none font-clock font-bold tracking-tighter text-white">
                    00:00
                </div>
            </div>

            <div class="flex items-center space-x-6">
                <!-- Stop / Cancel -->
                <button onclick="stopTimer()" class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center active:scale-90 transition shadow-lg text-slate-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Play / Pause -->
                <button id="btn-play-pause" onclick="togglePlayPause()" class="w-28 h-28 bg-red-600 text-white rounded-full flex items-center justify-center active:scale-90 transition shadow-[0_0_20px_rgba(220,38,38,0.5)]">
                    <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>

                <!-- Skip Phase (Only for Rounds) -->
                <button id="btn-skip" onclick="skipPhase()" class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center active:scale-90 transition shadow-lg text-slate-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </section>

    </main>

    <script>
        // --- Web Audio API for Bell Sounds ---
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Synthesize a metallic bell sound
        function triggerSingleBell() {
            if (!audioCtx) initAudio();
            const t = audioCtx.currentTime;
            
            // Main fundamental tone (sine)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(750, t);
            osc1.frequency.exponentialRampToValueAtTime(740, t + 2);
            gain1.gain.setValueAtTime(0, t);
            gain1.gain.linearRampToValueAtTime(1, t + 0.05);
            gain1.gain.exponentialRampToValueAtTime(0.01, t + 2);
            
            // Metallic overtone (triangle)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(1300, t);
            gain2.gain.setValueAtTime(0, t);
            gain2.gain.linearRampToValueAtTime(0.5, t + 0.02);
            gain2.gain.exponentialRampToValueAtTime(0.01, t + 1.5);

            // Output connection
            osc1.connect(gain1);
            osc2.connect(gain2);
            gain1.connect(audioCtx.destination);
            gain2.connect(audioCtx.destination);
            
            osc1.start(t);
            osc2.start(t);
            osc1.stop(t + 2);
            osc2.stop(t + 2);
        }

        // Synthesize a wood clapper sound (two pieces of wood smacking)
        function triggerWoodClapper() {
            if (!audioCtx) initAudio();
            const t = audioCtx.currentTime;
            
            // 1. The solid thud / body of a heavy 2x4
            const oscBody = audioCtx.createOscillator();
            const gainBody = audioCtx.createGain();
            oscBody.type = 'sine';
            oscBody.frequency.setValueAtTime(400, t);
            oscBody.frequency.exponentialRampToValueAtTime(100, t + 0.05);
            
            gainBody.gain.setValueAtTime(0, t);
            gainBody.gain.linearRampToValueAtTime(1.5, t + 0.001); // Instant hard hit
            gainBody.gain.exponentialRampToValueAtTime(0.001, t + 0.1); // Fast decay
            
            // 2. The sharp "clack" / impact of the surface
            const oscClick = audioCtx.createOscillator();
            const gainClick = audioCtx.createGain();
            oscClick.type = 'square';
            oscClick.frequency.setValueAtTime(1200, t);
            oscClick.frequency.exponentialRampToValueAtTime(200, t + 0.03);
            
            gainClick.gain.setValueAtTime(0, t);
            gainClick.gain.linearRampToValueAtTime(0.8, t + 0.001);
            gainClick.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            
            oscBody.connect(gainBody);
            oscClick.connect(gainClick);
            gainBody.connect(audioCtx.destination);
            gainClick.connect(audioCtx.destination);
            
            oscBody.start(t);
            oscClick.start(t);
            oscBody.stop(t + 0.1);
            oscClick.stop(t + 0.1);
        }

        function playClappers() {
            initAudio();
            triggerWoodClapper();
            // Second clack immediately after the first
            setTimeout(triggerWoodClapper, 150);
        }

        function playBell(times) {
            initAudio(); // Ensure context is awake
            let delays = [0];
            if (times === 2) delays = [0, 800];
            if (times === 3) delays = [0, 800, 1600];

            delays.forEach(delay => {
                setTimeout(triggerSingleBell, delay);
            });
        }

        // --- App State & Configuration ---
        const config = {
            rounds: 5,
            roundTime: 180, // 3 minutes in seconds
            breakTime: 60,   // 1 minute in seconds
            warningTime: 10, // 10 seconds warning (clapper)
            trainingTime: 300 // 5 minutes in seconds
        };

        // Active Timer State
        let timer = {
            mode: null,
            isActive: false,
            interval: null,
            timeLeft: 0,
            currentRound: 1,
            phase: 'prepare',
        };

        // --- DOM Elements ---
        const views = {
            home: document.getElementById('view-home'),
            'rounds-setup': document.getElementById('view-rounds-setup'),
            'timer-setup': document.getElementById('view-timer-setup'),
            'active-timer': document.getElementById('view-active-timer')
        };
        const headerTitle = document.getElementById('header-title');
        const btnBack = document.getElementById('btn-back');
        const activeTimerSection = document.getElementById('view-active-timer');
        
        // Active display elements
        const timeDisplay = document.getElementById('active-time-display');
        const stateBadge = document.getElementById('active-state-badge');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const btnSkip = document.getElementById('btn-skip');
        const mainHeader = document.getElementById('main-header');

        // --- Navigation ---
        function navTo(viewId) {
            initAudio(); // Unlock audio on user interaction
            
            // Hide all views
            Object.values(views).forEach(el => el.classList.remove('active'));
            
            // Show target view
            views[viewId].classList.add('active');

            // Header Management
            if (viewId === 'home') {
                btnBack.classList.add('hidden');
                headerTitle.textContent = 'Boxing - Miguel Ocampo';
                mainHeader.classList.remove('hidden');
            } else if (viewId === 'active-timer') {
                mainHeader.classList.add('hidden'); // Hide header when timer is running
            } else {
                btnBack.classList.remove('hidden');
                mainHeader.classList.remove('hidden');
                btnBack.onclick = () => navTo('home');
                
                if (viewId === 'rounds-setup') headerTitle.textContent = 'Sparring Setup';
                if (viewId === 'timer-setup') headerTitle.textContent = 'Timer Setup';
            }
        }

        // --- Settings Management ---
        function formatMMSS(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateSetupDisplay() {
            document.getElementById('setup-val-rounds').textContent = config.rounds;
            document.getElementById('setup-val-roundTime').textContent = formatMMSS(config.roundTime);
            document.getElementById('setup-val-breakTime').textContent = formatMMSS(config.breakTime);
            
            const warningDisplay = config.warningTime > 0 ? config.warningTime + 's' : 'OFF';
            document.getElementById('setup-val-warningTime').textContent = warningDisplay;
            
            document.getElementById('setup-val-trainingTime').textContent = formatMMSS(config.trainingTime);
        }

        function adjustSetting(key, change) {
            initAudio();
            if (key === 'rounds') {
                config.rounds = Math.max(1, Math.min(50, config.rounds + change));
            } else if (key === 'warningTime') {
                config.warningTime = Math.max(0, Math.min(60, config.warningTime + change));
            } else {
                config[key] = Math.max(15, Math.min(3600, config[key] + change));
            }
            updateSetupDisplay();
        }

        function setTrainingTime(seconds) {
            config.trainingTime = seconds;
            updateSetupDisplay();
        }

        // --- Timer Logic ---
        function startRounds() {
            timer.mode = 'rounds';
            timer.currentRound = 1;
            timer.phase = 'prepare';
            timer.timeLeft = 5; // 5 seconds prep time
            
            btnSkip.classList.remove('hidden');
            setupActiveTimerUI();
            startInterval();
        }

        function startTrainingTimer() {
            timer.mode = 'training';
            timer.timeLeft = config.trainingTime;
            timer.phase = 'work';
            
            btnSkip.classList.add('hidden');
            setupActiveTimerUI();
            startInterval();
        }

        function setupActiveTimerUI() {
            navTo('active-timer');
            timer.isActive = true;
            updateActiveDisplay();
            setPlayPauseUI(true);
        }

        function startInterval() {
            if (timer.interval) clearInterval(timer.interval);
            timer.isActive = true;
            setPlayPauseUI(true);
            timeDisplay.classList.remove('timer-paused');
            
            timer.interval = setInterval(() => {
                timer.timeLeft--;

                // Trigger clapper warning
                if (timer.mode === 'rounds' && timer.phase === 'work' && timer.timeLeft === config.warningTime && config.warningTime > 0) {
                    playClappers();
                }
                
                if (timer.timeLeft < 0) {
                    handlePhaseTransition();
                } else {
                    updateActiveDisplay();
                }
            }, 1000);
        }

        function handlePhaseTransition() {
            if (timer.mode === 'training') {
                stopTimer();
                playBell(3); // End of workout
                return;
            }

            // Rounds logic
            if (timer.phase === 'prepare') {
                timer.phase = 'work';
                timer.timeLeft = config.roundTime;
                playBell(1); // Start round
            } else if (timer.phase === 'work') {
                if (timer.currentRound >= config.rounds) {
                    stopTimer();
                    playBell(3); // Workout complete
                    return;
                } else {
                    timer.phase = 'rest';
                    timer.timeLeft = config.breakTime;
                    playBell(2); // End of round
                }
            } else if (timer.phase === 'rest') {
                timer.currentRound++;
                timer.phase = 'work';
                timer.timeLeft = config.roundTime;
                playBell(1); // Start round
            }
            
            updateActiveDisplay();
        }

        function skipPhase() {
            if (timer.mode !== 'rounds') return;
            timer.timeLeft = 0; 
            handlePhaseTransition();
        }

        function togglePlayPause() {
            if (timer.isActive) {
                clearInterval(timer.interval);
                timer.isActive = false;
                setPlayPauseUI(false);
                timeDisplay.classList.add('timer-paused');
            } else {
                startInterval();
            }
        }

        function stopTimer() {
            clearInterval(timer.interval);
            timer.isActive = false;
            timeDisplay.classList.remove('timer-paused');
            
            if (timer.mode === 'rounds') {
                navTo('rounds-setup');
            } else {
                navTo('timer-setup');
            }
        }

        // --- Active UI Updates ---
        function updateActiveDisplay() {
            timeDisplay.textContent = formatMMSS(timer.timeLeft);

            activeTimerSection.className = 'view-section flex-col h-full items-center justify-center p-6 transition-colors duration-500 active';
            
            if (timer.mode === 'training') {
                stateBadge.textContent = 'Training Time';
                activeTimerSection.classList.add('bg-blue-900');
                btnPlayPause.className = 'w-28 h-28 bg-blue-600 text-white rounded-full flex items-center justify-center active:scale-90 transition shadow-[0_0_20px_rgba(37,99,235,0.5)]';
            } else {
                if (timer.phase === 'prepare') {
                    stateBadge.textContent = 'Get Ready';
                    activeTimerSection.classList.add('bg-yellow-900');
                    btnPlayPause.className = 'w-28 h-28 bg-yellow-600 text-white rounded-full flex items-center justify-center active:scale-90 transition shadow-[0_0_20px_rgba(202,138,4,0.5)]';
                } else if (timer.phase === 'work') {
                    stateBadge.textContent = `Round ${timer.currentRound} / ${config.rounds}`;
                    activeTimerSection.classList.add('bg-red-900');
                    btnPlayPause.className = 'w-28 h-28 bg-red-600 text-white rounded-full flex items-center justify-center active:scale-90 transition shadow-[0_0_20px_rgba(220,38,38,0.5)]';
                } else if (timer.phase === 'rest') {
                    stateBadge.textContent = 'Rest';
                    activeTimerSection.classList.add('bg-emerald-900');
                    btnPlayPause.className = 'w-28 h-28 bg-emerald-600 text-white rounded-full flex items-center justify-center active:scale-90 transition shadow-[0_0_20px_rgba(5,150,105,0.5)]';
                }
            }
        }

        function setPlayPauseUI(isPlaying) {
            if (isPlaying) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            }
        }

        // Initialize Display
        updateSetupDisplay();

    </script>
</body>
</html>
